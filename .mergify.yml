queue_rules:
  - name: default
    queue_conditions:
      - base = main
    merge_method: merge

merge_protections:
  - name: needs-one-approval
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"

pull_request_rules:
  - name: marker rule from base config
    conditions:
      - label = trigger-marker
    actions:
      comment:
        message: "BASE-CONFIG-RULE ran for {{ author }}"
